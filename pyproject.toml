[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rbg-harness"
version = "0.2.0"
description = "One main LLM plus deterministic control-plane, hybrid retrieval, sandboxed verification, and small learned models."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
keywords = ["mcp", "coding-agent", "retrieval", "verification", "llm"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
    "numpy",
    "libsql",
]

[project.urls]
Homepage = "https://github.com/emiliano-go/RBG-harness"
Issues = "https://github.com/emiliano-go/RBG-harness/issues"

[project.optional-dependencies]
dev = ["pytest"]
# Optional heavy retriever (harness/retrieval_heavy.py). Not needed for the
# default numpy-only install; large (torch) so deliberately opt-in.
semantic = ["transformers", "torch", "sentence-transformers"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[project.scripts]
rbg = "harness.__main__:main"
rbg-mcp = "harness.mcp_server:main"

[tool.hatch.build.targets.wheel]
packages = ["harness", "eval"]
