[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rbg"
version = "0.2.0"
description = "One main LLM plus deterministic control-plane, hybrid retrieval, sandboxed verification, and small learned models."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
keywords = ["mcp", "coding-agent", "retrieval", "verification", "llm"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
    "numpy",
    "libsql",
    "model2vec",
    "tree-sitter",
    "tree-sitter-language-pack",
]

[project.urls]
Homepage = "https://github.com/emiliano-go/RBG"
Issues = "https://github.com/emiliano-go/RBG/issues"

[project.optional-dependencies]
dev = ["pytest", "ruff", "mypy", "hypothesis", "pip-audit"]
# Optional heavy retriever (rbg/retrieval_heavy.py). Not needed for the
# default numpy-only install; large (torch) so deliberately opt-in.
semantic = ["transformers", "torch", "sentence-transformers"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[project.scripts]
rbg = "rbg.__main__:main"
rbg-mcp = "rbg.mcp_server:main"

[tool.hatch.build.targets.wheel]
packages = ["rbg", "eval"]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
