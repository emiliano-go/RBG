name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # bubblewrap lets the isolation tests exercise the real sandbox boundary
      # instead of the unisolated escape hatch.
      - run: sudo apt-get update && sudo apt-get install -y bubblewrap
      - run: pip install -e '.[dev]'
      - run: python -m pytest -q
