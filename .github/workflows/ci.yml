name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      # bubblewrap lets the isolation tests exercise the real sandbox boundary
      # instead of the unisolated escape hatch.
      - run: sudo apt-get update && sudo apt-get install -y bubblewrap
      # Ubuntu 24.04 blocks unprivileged user namespaces via AppArmor, which
      # makes bwrap fail its probe. Re-enable them for the sandbox tests.
      - run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          sudo sysctl -w kernel.unprivileged_userns_clone=1 || true
      - run: pip install -e '.[dev]'
      - run: ruff check rbg eval tests
      - run: python -m pytest -q
      # Exercise the console CLI path (not just eval.benchmark directly): its
      # argument forwarding is its own failure surface.
      - run: python -m rbg eval --suite eval/suites/smoke --config baseline --out /tmp/baseline.json
      - run: python -m rbg eval --suite eval/suites/smoke --config blind-full --out /tmp/blind-full.json
      - run: python -m rbg compare /tmp/baseline.json /tmp/blind-full.json
      # Retrieval recall ablation on the distractor-injected hard suite: prints
      # the lexical/dense/hybrid comparison the recall_at_1 CI floor guards.
      - run: python -m eval.retrieval_ablation eval/suites/hard --k 5
      # Deterministic fault-localization quality: does the changed line appear
      # in the top 1/5/10 Ochiai suspects on the smoke suite?
      - run: python -m eval.fault_localization_eval --suite eval/suites/smoke --min-hit-at-1 1.0 --out /tmp/fl.json
      - run: python -m eval.fault_localization_eval --suite eval/suites/fl-broad --min-hit-at-1 0.0 --min-file-recall-at-5 1.0 --min-region-recall-at-5 1.0 --out /tmp/fl-broad.json

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pip-audit
      - run: pip-audit
